[package]
name = "sr-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = ["camera-raw"]
# Camera RAW input through `rawler` (LGPL-2.1). Build with
# `--no-default-features` for a FITS/XISF-only binary that links no copyleft code.
camera-raw = ["sr-raw/camera-raw"]

[dependencies]
sr-core = { workspace = true }
sr-raw = { workspace = true }
sr-noise = { workspace = true }
sr-quality = { workspace = true }
sr-register = { workspace = true }
sr-warp = { workspace = true }
sr-reconstruct = { workspace = true }
sr-color = { workspace = true }
sr-composite = { workspace = true }
sha2 = { workspace = true }
sr-output = { workspace = true }
sr-diagnostics = { workspace = true }
sr-synth = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
rayon = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }

[[bin]]
name = "smokstak"
path = "src/main.rs"
