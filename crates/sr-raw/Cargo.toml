[package]
name = "sr-raw"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# Camera RAW (NEF, CR2, ARW, DNG, ...) through `rawler`, which is LGPL-2.1.
# Off by default so FITS/XISF users of this crate link no copyleft code; the
# smokstak binary turns it on.
camera-raw = ["dep:rawler"]

[dependencies]
sr-core = { workspace = true }
rawler = { workspace = true, optional = true }
rayon = { workspace = true }
serde = { workspace = true }
log = { workspace = true }
sha2 = { workspace = true }
quick-xml = { workspace = true }
flate2 = { workspace = true }
lz4_flex = { workspace = true }
thiserror = { workspace = true }
